services:
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - /Users/praneetha/projects/praneetha/dbt-practice/postgres_dbt_practice_data/:/docker_data/

volumes:
  postgres_dbt_practice_data:
    driver: local
